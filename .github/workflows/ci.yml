# CasePilot CI：pytest 全量回归 + 覆盖率门禁（Python 版本矩阵）
# 规范：仅使用 actions/checkout 与 actions/setup-python 官方 action；
# 不引入第三方覆盖率上传服务（覆盖率徽章使用 shields.io 静态样式）；
# 测试全程离线（不出网），CI 不配置任何额外 secrets。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（含开发依赖）
        run: python -m pip install -e ".[dev]"

      - name: 运行测试与覆盖率门禁
        run: pytest --cov=casepilot --cov=evals --cov-fail-under=80
