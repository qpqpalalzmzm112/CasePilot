[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "casepilot"
version = "0.1.0"
description = "CasePilot：中文需求文档 / OpenAPI 文档 → 结构化测试用例 → 禅道 Excel 的 AI 测试用例生成 CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "CasePilot Dev" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
casepilot = "casepilot.cli:app"

[tool.setuptools.packages.find]
include = ["casepilot*", "evals*"]

[tool.setuptools.package-data]
evals = ["datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["casepilot"]
branch = false
