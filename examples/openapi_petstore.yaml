openapi: 3.0.3
info:
  title: Petstore 宠物商店接口
  description: 用于演示的 OpenAPI 3.0 接口文档，覆盖宠物、订单与用户三类资源。
  version: 1.0.0
servers:
  - url: https://petstore.example.com/v1
paths:
  /pet:
    post:
      summary: 创建宠物
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: 创建成功
    put:
      summary: 更新宠物信息
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: 更新成功
  /pet/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: 宠物 ID
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
    get:
      summary: 按 ID 查询宠物
      operationId: getPetById
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: 宠物不存在
    delete:
      summary: 删除宠物
      operationId: deletePet
      responses:
        '204':
          description: 删除成功
  /store/order:
    post:
      summary: 提交订单
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: 下单成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /user:
    post:
      summary: 创建用户
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: 用户创建成功
components:
  schemas:
    Pet:
      type: object
      required:
        - name
        - photoUrls
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: 旺财
        photoUrls:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        status:
          type: string
          description: 宠物状态
          enum:
            - available
            - pending
            - sold
    Order:
      type: object
      required:
        - petId
        - quantity
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        petId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 50
          description: 下单数量，单次最多 50 件
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - placed
            - approved
            - delivered
    User:
      type: object
      required:
        - username
        - password
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: 用户名，3-20 位字符
        password:
          type: string
          minLength: 8
          maxLength: 20
          description: 密码，8-20 位字符
        phone:
          type: string
          minLength: 11
          maxLength: 11
          description: 手机号，固定 11 位
        status:
          type: integer
          description: 账号状态
          minimum: 0
          maximum: 1
